[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constitutional-agent-testbench"
version = "0.1.0"
description = "Deterministic evaluation of structured responses against declared JSON rules"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Oonyl" }
]
dependencies = []

[project.scripts]
constitutional-agent-testbench = "constitutional_agent_testbench.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

