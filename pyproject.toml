[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "constitutional-agent-testbench"
version = "0.2.0"
description = "Deterministic evaluation of structured responses against declared JSON rules"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "EauDoon" }
]
dependencies = []

[project.scripts]
constitutional-agent-testbench = "constitutional_agent_testbench.cli:main"
constitutional-agent-testbench-playground = "constitutional_agent_testbench.playground:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

