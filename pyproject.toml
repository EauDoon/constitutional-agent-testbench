[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "constitutional-agent-testbench"
version = "0.5.19"
description = "Deterministic evaluation of structured responses against declared JSON rules"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "EauDoon" }
]
keywords = ["ai-agents", "policy-as-code", "json", "structured-output", "conformance-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Source = "https://github.com/EauDoon/constitutional-agent-testbench"
Changelog = "https://github.com/EauDoon/constitutional-agent-testbench/blob/main/CHANGELOG.md"
Issues = "https://github.com/EauDoon/constitutional-agent-testbench/issues"

[project.scripts]
constitutional-agent-testbench = "constitutional_agent_testbench.cli:main"
constitutional-agent-testbench-playground = "constitutional_agent_testbench.playground:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
constitutional_agent_testbench = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pyflakes plus the error-level pycodestyle rules, stated explicitly so a newer
# ruff with a wider default rule set cannot change what this gate means.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source_pkgs = ["constitutional_agent_testbench"]

[tool.coverage.report]
# Raise this floor with tests; never lower it to make a change pass.
fail_under = 95
show_missing = true
exclude_also = ['if __name__ == .__main__.:']
