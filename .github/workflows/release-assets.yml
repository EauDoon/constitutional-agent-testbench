name: release

# A pushed vX.Y.Z tag builds, verifies and publishes a GitHub Release.
# A manual run (workflow_dispatch) builds and verifies only; publish is skipped.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Check that the tag and every version surface agree
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python scripts/check_version.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/check_version.py
          fi
      - name: Install the pinned distribution builder
        run: python -m pip install --disable-pip-version-check "build==1.3.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Require exactly the two expected archives
        run: |
          v="$(python scripts/check_version.py --print-version)"
          test -f "dist/constitutional_agent_testbench-${v}-py3-none-any.whl"
          test -f "dist/constitutional_agent_testbench-${v}.tar.gz"
          test "$(ls dist | wc -l)" -eq 2
          python -m zipfile -l "dist/constitutional_agent_testbench-${v}-py3-none-any.whl"
          python -m tarfile -l "dist/constitutional_agent_testbench-${v}.tar.gz"
      - name: Test the built wheel
        run: |
          v="$(python scripts/check_version.py --print-version)"
          python -m pip install --disable-pip-version-check --no-deps "dist/constitutional_agent_testbench-${v}-py3-none-any.whl"
          test "$(constitutional-agent-testbench --version)" = "constitutional-agent-testbench ${v}"
          python -m unittest discover -s tests
          python scripts/verify_installed_workflow.py
      - name: Write and self-verify checksums with relative names
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Extract release notes from the changelog
        run: python scripts/check_version.py --release-notes > RELEASE_NOTES.md
      - name: Retain verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
          --verify-tag
