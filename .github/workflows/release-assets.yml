name: release assets

on:
  workflow_dispatch:
  push:
    tags: ["v0.5.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check "setuptools==83.0.0" "build==1.3.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify archive contents and hashes
        run: |
          python -m zipfile -l dist/constitutional_agent_testbench-0.5.1-py3-none-any.whl
          python -m tarfile -l dist/constitutional_agent_testbench-0.5.1.tar.gz
          sha256sum dist/* > dist/SHA256SUMS
      - name: Retain reviewed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: constitutional-agent-testbench-v0.5.1
          path: dist/*
          if-no-files-found: error
          retention-days: 14
